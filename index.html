<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Πάρε 5</title>
    <style>
        /* Add styles for the KS counter box */
        #ks-counter {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            font-size: 16px;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
    <link rel="stylesheet" href="style.css">
    <script>
        window.onload = function() {
            const day = new Date().getDay();
            const topH1 = document.getElementById('topHeader');
            const bottomH1 = document.getElementById('bottomHeader');
            // Define todays date (May 6th, 2025)
            const start_count = new Date(2025, 4, 6); // May is month 4 in JavaScript
            const today = new Date();
            const num_days = 12 - Math.floor((today - start_count) / (1000 * 60 * 60 * 24));
            
            // Create KS counter box instead of alert
            const ksCounter = document.createElement('div');
            ksCounter.id = 'ks-counter';
            ksCounter.textContent = "ΠΑΜΕ ΠΑΛΑAAAAA " + num_days + "ΚΣ ΑΚΟΜΑ";
            document.body.appendChild(ksCounter);
            
            // Make counter disappear after 5 seconds
            setTimeout(() => {
                ksCounter.style.transition = 'opacity 1s';
                ksCounter.style.opacity = '0';
                // Remove from DOM after fade out
                setTimeout(() => {
                    ksCounter.remove();
                }, 1000);
            }, 30000);
            
            const no_foniades_days = [6, 0, 1];
            const days_plural = {
                0: "Κυριακές",
                1: "Δευτέρες",
                2: "Τρίτες",
                3: "Τετάρτες",
                4: "Πέμπτες",
                5: "Παρασκευές",
                6: "Σάββατα"
            };
            const is_no_foniades = no_foniades_days.includes(day);
            document.body.dataset.is_no_foniades = is_no_foniades;
            
            if (is_no_foniades) {
                topH1.textContent = "Πάρε 5 Special Edition";
                bottomH1.textContent = "Χωρίς Φωνιάδες των Λαών" + " " + days_plural[day];
            } else {
                topH1.textContent = "Πάρε 5";
                bottomH1.textContent = ""; // Empty for non-Monday
            }
        };
    </script>
</head>
<body>
    <h1 id="topHeader">Πάρε 5</h1>
    <h1 id="bottomHeader"></h1>
    <div id="challenge"></div>
    <script src="script.js?v=<?= time(); ?>"></script>
</body>
</html>
